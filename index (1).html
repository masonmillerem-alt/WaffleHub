<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaffleHub Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            height: 72px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #292929;
            background: #151515;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .section {
            margin-bottom: 42px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 21px;
        }

        .section-title span {
            color: #777;
            font-size: 14px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .game {
            min-height: 145px;
            padding: 20px;
            background: #1a1a1a;
            border: 1px solid #292929;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
        }

        .game:hover {
            transform: translateY(-3px);
            background: #202020;
            border-color: #444;
        }

        .game-icon {
            font-size: 36px;
            margin-bottom: 13px;
        }

        .game h3 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        .game p {
            margin: 0;
            color: #888;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 850px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }

            .main {
                padding: 25px 16px 45px;
            }

            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🧇 WaffleHub</div>
</header>

<main class="main">

    <section class="section">
        <div class="section-title">
            <h2>🔥 Featured</h2>
            <span>Games</span>
        </div>

        <div class="game-grid">
            <a class="game" href="games/snake/">
                <div class="game-icon">🐍</div>
                <h3>Snake</h3>
                <p>Classic snake</p>
            </a>

            <a class="game" href="games/pong/">
                <div class="game-icon">🏓</div>
                <h3>Pong</h3>
                <p>Classic arcade</p>
            </a>

            <a class="game" href="games/flappy/">
                <div class="game-icon">🐦</div>
                <h3>Flappy</h3>
                <p>See how far you can go</p>
            </a>

            <a class="game" href="games/breakout/">
                <div class="game-icon">🧱</div>
                <h3>Breakout</h3>
                <p>Break the blocks</p>
            </a>
        </div>
    </section>

    <section class="section">
        <div class="section-title">
            <h2>🎮 Arcade</h2>
            <span>More games</span>
        </div>

        <div class="game-grid">
            <a class="game" href="games/asteroids/">
                <div class="game-icon">🚀</div>
                <h3>Asteroids</h3>
                <p>Survive the asteroid field</p>
            </a>

            <a class="game" href="games/memory/">
                <div class="game-icon">🧠</div>
                <h3>Memory</h3>
                <p>Test your memory</p>
            </a>
        </div>
    </section>

</main>

<footer>
    WaffleHub
</footer>

</body>
</html>
