<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
html,body{margin:0;height:100%;background:#222;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif}
#wrap{text-align:center;color:white}
canvas{display:block;width:min(92vw,520px);height:auto;background:#87ceeb;border:4px solid #111;border-radius:10px;touch-action:none}
p{margin:10px 0;font-weight:bold}
button{padding:10px 18px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="520" height="700"></canvas>
<p>Space / ↑ / Click / Tap = Flap</p>
<button onclick="reset()">Restart</button>
</div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const W=c.width,H=c.height,ground=620;
let bird,pipes,score,best=0,state,spawn,last;
try{best=Number(localStorage.getItem("flappyBest")||0)}catch(e){}
function reset(){
 bird={x:125,y:300,r:17,vy:0};
 pipes=[];score=0;state="ready";spawn=0;last=0;draw();
}
function flap(){
 if(state==="dead")reset();
 if(state==="ready")state="playing";
 bird.vy=-8.5;
}
function pipe(){
 const gap=155,top=90+Math.random()*(ground-gap-160);
 pipes.push({x:W+20,w:72,top,gap,passed:false});
}
function hit(cx,cy,r,rx,ry,rw,rh){
 let x=Math.max(rx,Math.min(cx,rx+rw)),y=Math.max(ry,Math.min(cy,ry+rh));
 return (cx-x)**2+(cy-y)**2<r*r;
}
function die(){if(state==="playing")state="dead"}
function update(dt){
 if(state!=="playing")return;
 bird.vy+=25*dt;bird.y+=bird.vy*dt;
 spawn-=dt;if(spawn<=0){pipe();spawn=1.45}
 for(const p of pipes){
  p.x-=190*dt;
  if(!p.passed&&p.x+p.w<bird.x){
   p.passed=true;score++;
   if(score>best){best=score;try{localStorage.setItem("flappyBest",best)}catch(e){}}
  }
  if(hit(bird.x,bird.y,bird.r,p.x,0,p.w,p.top)||
     hit(bird.x,bird.y,bird.r,p.x,p.top+p.gap,p.w,ground-p.top-p.gap))die();
 }
 pipes=pipes.filter(p=>p.x+p.w>-20);
 if(bird.y-bird.r<0||bird.y+bird.r>ground)die();
}
function draw(){
 ctx.fillStyle="#87ceeb";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,255,255,.7)";
 cloud(70,100,1);cloud(390,190,.7);
 for(const p of pipes){
  drawPipe(p.x,0,p.w,p.top,true);
  drawPipe(p.x,p.top+p.gap,p.w,ground-p.top-p.gap,false);
 }
 ctx.fillStyle="#65b741";ctx.fillRect(0,ground,W,18);
 ctx.fillStyle="#c9a34d";ctx.fillRect(0,ground+18,W,H-ground-18);
 for(let x=0;x<W;x+=30){ctx.fillStyle="#e0bc62";ctx.fillRect(x,ground+28,15,5)}
 ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.5,Math.min(1.1,bird.vy/10)));
 ctx.fillStyle="#ffd83d";ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f09b25";ctx.beginPath();ctx.ellipse(-8,7,10,5,-.2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(7,-7,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#222";ctx.beginPath();ctx.arc(9,-7,3,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f07832";ctx.beginPath();ctx.moveTo(15,-1);ctx.lineTo(34,5);ctx.lineTo(15,9);ctx.closePath();ctx.fill();
 ctx.restore();
 ctx.fillStyle="white";ctx.font="bold 36px Arial";ctx.textAlign="center";ctx.fillText(score,W/2,60);
 ctx.font="bold 18px Arial";ctx.fillText("Best: "+best,W/2,88);
 if(state==="ready")overlay("FLAPPY BIRD","Press SPACE or TAP to start");
 if(state==="dead")overlay("GAME OVER","Press SPACE or TAP to restart");
}
function drawPipe(x,y,w,h,top){
 if(h<=0)return;
 ctx.fillStyle="#45a843";ctx.fillRect(x,y,w,h);
 ctx.fillStyle="#369238";ctx.fillRect(x+8,y,9,h);
 let cy=top?y+h-25:y;
 ctx.fillStyle="#55bd55";ctx.fillRect(x-6,cy,w+12,25);
 ctx.fillStyle="#398e3c";ctx.fillRect(x-6,cy+20,w+12,5);
}
function cloud(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="rgba(255,255,255,.7)";
 ctx.beginPath();ctx.arc(0,12,22,0,Math.PI*2);ctx.arc(25,4,30,0,Math.PI*2);ctx.arc(55,14,20,0,Math.PI*2);ctx.fill();ctx.restore();
}
function overlay(a,b){
 ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(0,0,W,ground);
 ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 42px Arial";ctx.fillText(a,W/2,280);
 ctx.font="bold 19px Arial";ctx.fillText(b,W/2,320);ctx.textAlign="left";
}
function loop(t){
 if(!last)last=t;
 const dt=Math.min(.035,(t-last)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap()}
});
c.addEventListener("pointerdown",e=>{e.preventDefault();flap()});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
